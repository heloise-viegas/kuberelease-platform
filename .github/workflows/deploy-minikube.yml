name: Deploy commerce-api on Minikube

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev | stage | prod)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stage
          - prod
  push:
    branches:
      - main
    paths:
      - "helm/commerce-api/**"
      - "applications/commerce-api/**"
      - ".github/workflows/deploy-minikube.yml"

env:
  HELM_VERSION: "3.14.0"
  CHART_PATH: "./helm/commerce-api"
  CHART_NAME: "commerce-api"
  MINIKUBE_MEMORY: "4096"
  MINIKUBE_CPUS: "2"

jobs:
  lint-and-validate:
    name: Lint and Validate Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart (base values)
        run: |
          helm lint ${{ env.CHART_PATH }} \
            --strict \
            --set image.tag=lint-check

      - name: Lint chart (dev values)
        run: |
          helm lint ${{ env.CHART_PATH }} \
            --strict \
            --values ${{ env.CHART_PATH }}/values-dev.yaml \
            --set image.tag=dev

      - name: Lint chart (stage values)
        run: |
          helm lint ${{ env.CHART_PATH }} \
            --strict \
            --values ${{ env.CHART_PATH }}/values-stage.yaml \
            --set image.tag=stage

      - name: Lint chart (prod values)
        run: |
          helm lint ${{ env.CHART_PATH }} \
            --strict \
            --values ${{ env.CHART_PATH }}/values-prod.yaml \
            --set image.tag=latest

      - name: Render templates (dev)
        run: |
          helm template ${{ env.CHART_NAME }}-dev ${{ env.CHART_PATH }} \
            --values ${{ env.CHART_PATH }}/values-dev.yaml \
            --namespace commerce-dev \
            --debug \
            > /dev/null

      - name: Render templates (stage)
        run: |
          helm template ${{ env.CHART_NAME }}-stage ${{ env.CHART_PATH }} \
            --values ${{ env.CHART_PATH }}/values-stage.yaml \
            --namespace commerce-stage \
            --debug \
            > /dev/null

      - name: Render templates (prod)
        run: |
          helm template ${{ env.CHART_NAME }}-prod ${{ env.CHART_PATH }} \
            --values ${{ env.CHART_PATH }}/values-prod.yaml \
            --namespace commerce-prod \
            --debug \
            > /dev/null

  deploy-minikube:
    name: Deploy to Minikube
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubectl and minikube
        run: |
          sudo apt-get update
          sudo apt-get install -y conntrack socat
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube

      - name: Start Minikube
        run: |
          minikube start --driver=docker --memory=${{ env.MINIKUBE_MEMORY }} --cpus=${{ env.MINIKUBE_CPUS }}
          minikube status

      - name: Enable required addons
        run: |
          minikube addons enable ingress

      - name: Wait for ingress controller and webhook
        run: |
          echo "Waiting for ingress-nginx controller to be ready..."
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=120s || true
          kubectl -n ingress-nginx wait --for=condition=available deployment/ingress-nginx-controller --timeout=120s || true
          echo "Waiting for admission webhook endpoints..."
          for i in $(seq 1 60); do
            if kubectl -n ingress-nginx get endpoints ingress-nginx-controller-admission -o json | grep -q "addresses"; then
              echo "Admission webhook endpoints ready"
              break
            fi
            sleep 2
          done

      - name: Configure deployment variables
        run: |
          TARGET_ENV="${{ github.event.inputs.environment }}"
          if [ -z "$TARGET_ENV" ]; then
            TARGET_ENV=dev
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_ENV
          if [ "${TARGET_ENV}" = "prod" ]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
            echo "VALUE_FILE=${{ env.CHART_PATH }}/values-prod.yaml" >> $GITHUB_ENV
            echo "NAMESPACE=commerce-prod" >> $GITHUB_ENV
          elif [ "${TARGET_ENV}" = "stage" ]; then
            echo "IMAGE_TAG=stage" >> $GITHUB_ENV
            echo "VALUE_FILE=${{ env.CHART_PATH }}/values-stage.yaml" >> $GITHUB_ENV
            echo "NAMESPACE=commerce-stage" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
            echo "VALUE_FILE=${{ env.CHART_PATH }}/values-dev.yaml" >> $GITHUB_ENV
            echo "NAMESPACE=commerce-dev" >> $GITHUB_ENV
          fi

      - name: Build image inside Minikube
        run: |
          eval "$(minikube -p minikube docker-env)"
          docker build -t ghcr.io/your-org/commerce-api:${IMAGE_TAG} ./applications/commerce-api

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${NAMESPACE} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy chart to Minikube
        run: |
          helm upgrade --install ${{ env.CHART_NAME }}-${TARGET_ENV} ${{ env.CHART_PATH }} \
            --values "${VALUE_FILE}" \
            --namespace "${NAMESPACE}" \
            --atomic \
            --timeout 8m \
            --set image.tag=${IMAGE_TAG} \
            --set image.pullPolicy=IfNotPresent \
            --set "podAnnotations.deploy-time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/${{ env.CHART_NAME }}-${TARGET_ENV} \
            --namespace "${NAMESPACE}" \
            --timeout=5m

      - name: Show release status
        run: |
          helm status ${{ env.CHART_NAME }}-${TARGET_ENV} --namespace "${NAMESPACE}"
          helm history ${{ env.CHART_NAME }}-${TARGET_ENV} --namespace "${NAMESPACE}"
