apiVersion: v1
kind: Secret
metadata:
  name: {{ include "commerce-api.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "commerce-api.labels" . | nindent 4 }}
  annotations:
    # In production, this Secret should be managed by the External Secrets Operator
    # or Sealed Secrets rather than rendered from values.yaml.
    # See docs/design-decisions.md — ADR-003 for the secret management strategy.
    kuberelease.io/secret-source: "helm-values"
type: Opaque
data:
  {{- range $key, $value := .Values.secret }}
  # Values in the secret block of values.yaml must already be base64-encoded.
  # The chart does NOT re-encode them — this prevents double-encoding.
  {{ $key }}: {{ $value }}
  {{- end }}
