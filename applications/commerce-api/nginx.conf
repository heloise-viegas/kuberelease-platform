# =============================================================================
# commerce-api — NGINX Server Configuration
# =============================================================================
# Listens on port 8080 (non-privileged) to satisfy the non-root container
# security requirement. The Kubernetes Service maps port 80 → 8080.
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Security headers
    # Applied to all responses.
    # ---------------------------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin"         always;
    add_header Permissions-Policy        "geolocation=(), microphone=()" always;
    add_header Content-Security-Policy   "default-src 'self'"    always;

    # Remove NGINX version from Server header
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Liveness probe endpoint
    # Returns 200 OK immediately. Used by the Kubernetes liveness probe.
    # If NGINX is running and can serve a response, the container is alive.
    # ---------------------------------------------------------------------------
    location /healthz {
        access_log off;
        return 200 '{"status":"ok","service":"commerce-api"}';
        add_header Content-Type application/json;
    }

    # ---------------------------------------------------------------------------
    # Readiness probe endpoint
    # Returns 200 OK when the service is ready to accept traffic.
    # In a real application this would check downstream dependencies.
    # ---------------------------------------------------------------------------
    location /ready {
        access_log off;
        return 200 '{"status":"ready","service":"commerce-api"}';
        add_header Content-Type application/json;
    }

    # ---------------------------------------------------------------------------
    # Metrics endpoint (stub)
    # In production, this path is scraped by Prometheus via the pod annotation
    # prometheus.io/path: /metrics defined in values.yaml.
    # ---------------------------------------------------------------------------
    location /metrics {
        access_log off;
        return 200 '# commerce-api metrics\nhttp_requests_total 0\n';
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------------
    # Application root
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets for 1 hour in browser
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # ---------------------------------------------------------------------------
    # Gzip compression
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ---------------------------------------------------------------------------
    # Error pages
    # ---------------------------------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
